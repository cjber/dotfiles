# The timer that runs dotter deploy + git sync. Tracked so a fresh clone can
# start the mechanism that keeps itself up to date.
# NB: never `systemctl --user reenable` a unit dotter manages. Dotter deploys
# these as symlinks, and systemd treats a symlinked unit file in its search
# path as an enablement link - `disable` deletes the unit itself. Enable by
# linking into timers.target.wants/ (pointing at the repo path), as the other
# timers here are, and re-run `dotter deploy` if a unit ever goes missing.
"config/systemd/user/dotfiles-sync.service" = "~/.config/systemd/user/dotfiles-sync.service"
"config/systemd/user/dotfiles-sync.timer" = "~/.config/systemd/user/dotfiles-sync.timer"
