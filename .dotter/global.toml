# Root-owned system config. NOT in local.toml's package list, because these
# targets are outside $HOME and need root. Deploy them on their own, via the
# root-only local config and a separate cache, so the normal user deploy (which
# reads local.toml) is unaffected:
#   sudo dotter -l .dotter/local-root.toml \
#     --cache-file .dotter/cache-root.toml --cache-directory .dotter/cache-root \
#     deploy
# (add --force the first time on a machine that already has these files in
# /etc, so dotter adopts them instead of skipping.) Run `sudo keyd reload`
# afterwards to pick the changes up.
# Copied (type = "template") rather than symlinked on purpose: keyd runs as
# root, and a symlink into a user-writable repo would let any process running
# as this user change what the root daemon loads.
[root.files]
"etc/keyd/keychron-m7-mouse.conf" = { target = "/etc/keyd/keychron-m7-mouse.conf", type = "template" }
"etc/keyd/logitech-g-mouse.conf" = { target = "/etc/keyd/logitech-g-mouse.conf", type = "template" }
"etc/nftables.conf" = { target = "/etc/nftables.conf", type = "template" }
# Password-OR-phone sudo. Copied, not symlinked, for the same reason as keyd:
# PAM decides who becomes root, so a symlink into this user-writable repo would
# let any process running as this user rewrite the gate it is standing behind.
# 0644 is correct for /etc/pam.d, so this needs no post-deploy chmod - unlike
# /etc/sudoers and /etc/duo/pam_duo.conf, which need 0440/0600 and a secret and
# are therefore handled by ~/scripts/harden-auth.sh instead. See
# docs/phone-auth.md.
"etc/pam.d/sudo" = { target = "/etc/pam.d/sudo", type = "template" }
"etc/ssh/sshd_config.d/10-hardening.conf" = { target = "/etc/ssh/sshd_config.d/10-hardening.conf", type = "template" }
"etc/systemd/system/beszel-hub.service" = { target = "/etc/systemd/system/beszel-hub.service", type = "template" }
# Disables the internal Intel BT adapter so the UGreen BT6.0 dongle is the
# default. Needs `sudo udevadm control --reload` after deploying.
"etc/udev/rules.d/81-disable-intel-bluetooth.rules" = { target = "/etc/udev/rules.d/81-disable-intel-bluetooth.rules", type = "template" }

