# Keychron M7 8K: thumb side buttons -> held modifier layers.
# Port of logitech-g-mouse.conf (G503/G903) onto the M7 8K (3434:d056),
# keeping the same muscle memory: control / shift / alt.
#
# keyd matches on vid:pid, so this grabs BOTH of the M7's collections: the
# mouse (buttons 272-276) and its "Keyboard" collection. That is deliberate -
# the front thumb button is NOT a mouse button, it ships as Page Down on the
# keyboard collection, so it can only be bound from here. Scoping it to these
# [ids] means a real keyboard's Page Down is unaffected.
[ids]

m:3434:d056

[main]

# The two stacked thumb buttons emit BTN_SIDE / BTN_EXTRA, same codes the
# Logitech used.
mouse1 = layer(control)
mouse2 = layer(shift)

# Front thumb button. Ships as Page Down rather than BTN_FORWARD (the M7's
# mouse collection reports no button 277), so it is bound by keysym. If you
# ever remap it in Keychron Launcher (launcher.keychron.com, WebHID), change
# this line to match whatever it then emits.
pagedown = layer(alt)
