# Logitech G-series mouse: thumb side buttons -> held modifier layers.
# Grabs the current G503 (via USB receiver 046d:c547) and, if it ever
# comes back, the old G903 Lightspeed (046d:4087). The m: prefix matches
# mice only, so keyd leaves the receiver's keyboard collection untouched.
[ids]

m:046d:c547
046d:4087

[main]

# Two main thumb buttons emit BTN_SIDE / BTN_EXTRA. No macro on the mouse.
mouse1 = layer(control)
mouse2 = layer(shift)

# Sniper button (the aim/crosshair one below the thumb buttons) is remapped
# ONBOARD via ratbagd from its default DPI-shift to logical "button 6", which
# the kernel reports as BTN_FORWARD (277) = keyd "mouseforward". Held = Alt.
#   ratbagctl <dev> button 4 action set button 6   (persists in onboard profile)
mouseforward = layer(alt)
